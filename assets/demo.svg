<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="8" y="8" width="704" height="380" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="34" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="38" r="6" fill="#27c93f"/>
  <text x="100" y="43" fill="#8b949e" font-size="14">honest-confidence — TruthfulQA MC1 · 4-seed mean</text>
  <line x1="24" y1="60" x2="696" y2="60" stroke="#21262d" stroke-width="1"/>

  <text x="332" y="92" fill="#8b949e" font-size="13" letter-spacing="0.5">RAW</text>
  <text x="520" y="92" fill="#8b949e" font-size="13" letter-spacing="0.5">HONEST</text>

  <g font-size="14.5">
    <text x="32" y="140" fill="#c9d1d9">calibration error (ECE)</text>
    <text x="332" y="140" fill="#8b949e">0.479</text>
    <text x="520" y="140" fill="#3fb950">0.139</text>
    <text x="600" y="140" fill="#3fb950" font-size="13">↓ ~3.4×</text>

    <text x="32" y="184" fill="#c9d1d9">confidently wrong (≥0.70)</text>
    <text x="332" y="184" fill="#8b949e">57%</text>
    <text x="520" y="184" fill="#e3b341">undefined</text>
    <text x="600" y="184" fill="#6e7681" font-size="12">cap sits below 0.70</text>

    <text x="32" y="228" fill="#c9d1d9">ranking (AUROC)</text>
    <text x="332" y="228" fill="#8b949e">0.58</text>
    <text x="520" y="228" fill="#e3b341">0.51</text>
    <text x="600" y="228" fill="#e3b341" font-size="13">↓ the cost</text>
  </g>

  <line x1="24" y1="262" x2="696" y2="262" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="292" fill="#c9d1d9" font-size="14">caps stated confidence at measured accuracy (~37%); abstains when it can't ground a claim.</text>
  <text x="32" y="320" fill="#8b949e" font-size="13">the win <tspan fill="#3fb950">(calibration)</tspan> and its cost <tspan fill="#e3b341">(ranking)</tspan> are both reported — not just the win.</text>
  <text x="32" y="356" fill="#6e7681" font-size="12">one model, one benchmark, n=490 eval / 327 held out to fit the cap. a measurement, not a leaderboard.</text>
</svg>
